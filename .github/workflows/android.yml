name: Android CI

on:
  push:
    branches: [ "master", "feature/*" ]
jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge')
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Write key
        if: github.event_name != 'pull_request'
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Validate signing secrets
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_STORE" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are required to publish release builds."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release variants
        run: |
          ./gradlew assembleWhatsappRelease assembleBusinessRelease -Pminify=true

      - name: Get short SHA
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV

      - name: Build release notes
        run: |
          node scripts/automation/build_release_notes.mjs --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload WhatsApp flavor artifacts
        uses: actions/upload-artifact@v5
        with:
          name: whatsapp-release-app-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/whatsapp/release/app-whatsapp-release.apk

      - name: Upload Business flavor artifacts
        uses: actions/upload-artifact@v5
        with:
          name: business-release-app-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/business/release/app-business-release.apk

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaEnhancer ${{ env.SHORT_SHA }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            app/build/outputs/apk/whatsapp/release/app-whatsapp-release.apk
            app/build/outputs/apk/business/release/app-business-release.apk
          tag_name: release-${{ env.SHORT_SHA }}

      - name: Read changelog
        if: ${{ success() && github.ref == 'refs/heads/master' && github.ref_type != 'tag' && env.BOT_TOKEN != '' }}
        id: changelog
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.txt', 'utf8').trim();
            core.setOutput('content', changelog);

      - name: Post to Telegram channel
        if: ${{ success() && github.ref == 'refs/heads/master' && github.ref_type != 'tag' && env.BOT_TOKEN != '' }}
        uses: Dev4Mod/telegram-github-action@master
        with:
          to: ${{ env.CHANNEL_ID }}
          token: ${{ env.BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.changelog.outputs.content }}

            Release: https://github.com/${{ github.repository }}/releases/tag/release-${{ env.SHORT_SHA }}
